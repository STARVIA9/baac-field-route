name: ✅ Auto tests

# รัน harness ทุกไฟล์เมื่อมี push แตะโค้ด/เทส — แดงรู้เลย ไม่ต้องรอพ่อเจอบั๊ก (เฟส 5)
# + push ขึ้น main = deploy Cloudflare Pages อัตโนมัติ (31 ต.ค.69 — กัน "muse code push แล้วเว็บไม่อัปเดต")

on:
  push:
    paths:
      - 'functions/**'
      - 'public/**'
      - 'public/_headers'
      - 'public/admin.html'
      - 'tests/**'
  workflow_dispatch: {}      # กดมือได้จากแท็บ Actions

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node syntax (functions + js)
        run: |
          node --check functions/_lib/shared.js
          node --check functions/api/customers.js
          node --check "functions/api/customers/[cif].js"
          node --check functions/api/admin/backup.js
          node --check public/js/storage.js
          node --check public/js/vendor.js
          node --check public/js/admin-customers.js
      - name: harness ทุกไฟล์
        run: |
          fail=0
          for f in tests/test_*.mjs; do echo "== $f"; node "$f" || fail=1; done
          exit $fail
      - name: bundle ตรง source (กัน bundle เก่าหลุดขึ้นเว็บ)
        if: github.ref == 'refs/heads/main'
        run: |
          bash scripts/build-bundles.sh
          if ! git diff --quiet; then
            echo "❌ app.bundle.js ใน git ไม่ตรงกับ source — รัน scripts/build-bundles.sh + bump ?v= ใน index.html ก่อน push"
            git diff --stat
            exit 1
          fi
      - name: deploy Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CLOUDFLARE_TELEMETRY_DISABLED: '1'
        run: npx -y wrangler@4 pages deploy public --project-name baac-field-route
